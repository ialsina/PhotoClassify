[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=photoclassify
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --randomly-seed=42
    --timeout=30
    -n auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take longer to run 